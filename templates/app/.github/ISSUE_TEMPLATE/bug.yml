name: 버그
description: 의도와 다르게 동작하는 것
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      description: URL(프로덕션/프리뷰), 순서, 기기·브라우저
      placeholder: |
        1. https://... 에 들어간다
        2. ... 를 누른다
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작과 실제 동작
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 근거
      description: 스크린샷, 오류 메시지, 발생 시각. 비밀번호·토큰·개인정보는 빼주세요.
