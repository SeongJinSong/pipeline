# 리뷰어 Slack 앱 (두 번째 앱). api.slack.com/apps → Create New App → From a manifest → 이 파일 붙여넣기
# 파피와 같은 서버 프로세스에서 돈다. 설정 순서: docs/REVIEWER.md
display_information:
  name: 리비
  description: 파피가 올린 PR 을 Codex 로 리뷰해요 (읽기 전용, 코드는 안 고쳐요)
  background_color: "#1f2937"
features:
  bot_user:
    display_name: reviewer # 설치 후 앱 설정에서 표시 이름을 '리비'로 바꿔요 (mujuhoney 는 리비로 바꿔 둠)
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read # '@리비' 로 부르면 다시 리뷰
      - channels:join # 앱 채널에 처음 글을 쓸 때 스스로 들어감
      - chat:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
