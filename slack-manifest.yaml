# api.slack.com/apps → Create New App → From a manifest → 이 파일 붙여넣기
display_information:
  name: pipeline
  description: 아이디어 → 앱 출시 → 요구사항 → 코드수정 → 배포
  background_color: "#111827"
features:
  bot_user:
    display_name: pipeline
    always_online: true
  slash_commands:
    - command: /newapp
      description: 아이디어로 새 앱 만들기 (레포·Vercel·AWS·Slack 채널까지)
      usage_hint: 동네 러닝 크루를 모집하는 앱
      should_escape: false
    - command: /apps
      description: 지금까지 만든 앱 목록
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:join
      - channels:manage
      - channels:read
      - chat:write
      - commands
      - im:write
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
